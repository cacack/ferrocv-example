name: build

# GitHub Pages visibility warning:
# On Free plans, Pages cannot publish from a private repo at all.
# On Pro/Team plans, Pages from a private repo publishes a PUBLIC site
# (reachable at https://<user>.github.io/<repo>). Private-access Pages
# requires GitHub Enterprise Cloud. The Pages deploy below is therefore
# opt-in via the `publish_pages` workflow_dispatch input.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Also deploy to GitHub Pages (PUBLIC site on Pro/Team — see warning in workflow file)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

      - uses: cacack/ferrocv/.github/actions/setup-ferrocv@bcf14b6e0966c78c58d5dc718f528d31a5e3be29 # v0.11.0
        with:
          version: v0.9.0

      - name: validate resume.json
        run: ferrocv validate resume.json

      - name: check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --verbose resume.json
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  render:
    name: render
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cacack/ferrocv/.github/actions/setup-ferrocv@bcf14b6e0966c78c58d5dc718f528d31a5e3be29 # v0.11.0
        with:
          version: v0.9.0

      - name: render PDF
        run: ferrocv render resume.json --theme classic --output dist/resume.pdf

      - name: render HTML
        run: ferrocv render resume.json --format html --output dist/resume.html

      - name: render plain text
        run: ferrocv render resume.json --format text --output dist/resume.txt

      - name: upload rendered preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume-${{ github.sha }}
          path: dist/resume.*
          retention-days: 14

      - name: publish latest release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/resume.* \
            --repo "$GITHUB_REPOSITORY" \
            --title "latest" \
            --notes "Rendered from ${GITHUB_SHA}" \
            --latest

      - name: stage pages content
        if: ${{ inputs.publish_pages == true }}
        run: cp .github/pages/index.html dist/index.html

      - name: upload pages artifact
        if: ${{ inputs.publish_pages == true }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy to pages
    if: ${{ inputs.publish_pages == true }}
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
